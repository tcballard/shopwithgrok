# Replace grokshop-your-name with a unique Fly app name before the first launch.
# The public URL is then https://<app-name>.fly.dev until Tom buys a domain.
app = "grokshop-your-name"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  GROKSHOP_HTTP_HOST = "0.0.0.0"
  GROKSHOP_PUBLIC_URL = "https://YOUR_HOST"
  GROKSHOP_SHIPPING_MODE = "stub"
  GROKSHOP_PAYMENTS_MODE = "stub"
  GROKSHOP_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
